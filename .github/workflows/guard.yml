name: Guard injected code

# Fails when the files of the known code injection (an `init` loader, an `.orc`
# payload, a folder-open VS Code task) are in the repo. See scripts/check-injected-code.mjs.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-injected-code.mjs
